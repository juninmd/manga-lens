name: Commits

# O release.yml calcula a versao pelo prefixo dos commits (Conventional Commits).
# Aqui o PR avisa antes do merge: commit e titulo fora do padrao ainda publicam
# (viram patch), mas somem das notas da release.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Commits e titulo no padrao
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: bun run scripts/check-commits.ts "origin/$BASE"
