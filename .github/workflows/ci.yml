name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR novo cancela a execucao anterior do mesmo branch: nada de fila de builds mortos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # a suite inteira roda em segundos: travamento tem de falhar rapido, nao segurar a fila 10 min
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      # pacotes baixados ficam entre execucoes: so' muda quando o bun.lock muda
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # lint + typecheck + testes unitarios: tudo deterministico e sem rede.
      # A homologacao com provider real (`bun run smoke`) fica de fora de proposito:
      # depende de site de terceiro no ar e tornaria o vermelho do CI ambiguo.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # segredo colado por engano reprova aqui; depois de entrar no historico,
      # tirar exige reescrever o git e rotacionar a chave assim mesmo
      - name: Credenciais e dados pessoais
        run: bun run secrets

      - name: Testes unitarios
        timeout-minutes: 3
        run: bun run test

      - name: Build do cliente
        run: bun run build:client
