[package]
name = "manga-lens"
version = "0.1.0"
description = "Leitor de mangas e HQs com OCR e traducao pt-BR"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
# LTO ligado estoura a memoria do rustc/LLVM nesta maquina ("LLVM ERROR: out of memory")
lto = false
codegen-units = 16
strip = true
